name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Harness-backed integration tests skip when the Rust test-harness binary
      # is absent (it isn't built in this standalone repo), so this runs the
      # pure unit suite. See src/harness.ts harnessBinaryAvailable().
      - run: bun test
